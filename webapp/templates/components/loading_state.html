{# Reusable Skeleton Loading State Component Partial #}
<div class="card card-glass p-6 space-y-4 animate-pulse {{ extra_classes|default:'' }}"
  id="{{ id|default:'loading-state-skeleton' }}">
  {% if title %}
  <div class="flex items-center justify-between border-b border-[var(--color-border)] pb-3">
    <div class="h-4 w-32 skeleton-box"></div>
    <div class="h-3 w-16 skeleton-box"></div>
  </div>
  {% endif %}

  {% if type == 'table' %}
  <div class="space-y-3">
    <div class="h-8 w-full skeleton-box"></div>
    <div class="h-12 w-full skeleton-box"></div>
    <div class="h-12 w-full skeleton-box"></div>
    <div class="h-12 w-full skeleton-box"></div>
  </div>
  {% elif type == 'cards' %}
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div class="h-28 w-full skeleton-box"></div>
    <div class="h-28 w-full skeleton-box"></div>
    <div class="h-28 w-full skeleton-box"></div>
  </div>
  {% elif type == 'widget' %}
  <div class="flex items-center gap-4">
    <div class="w-12 h-12 skeleton-circle shrink-0"></div>
    <div class="space-y-2 flex-1">
      <div class="h-4 w-3/4 skeleton-box"></div>
      <div class="h-3 w-1/2 skeleton-box"></div>
    </div>
  </div>
  {% else %}
  <div class="space-y-3">
    <div class="h-5 w-2/3 skeleton-box"></div>
    <div class="h-4 w-full skeleton-box"></div>
    <div class="h-4 w-5/6 skeleton-box"></div>
    <div class="h-10 w-36 skeleton-box mt-4"></div>
  </div>
  {% endif %}
</div>
